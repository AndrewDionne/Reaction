<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d28d9">
  <meta name="description" content="Reaction — Year 9 Science digital-first exam mode.">
  <title>Reaction · Exam mode</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=1.73.0">
  <style>
    :root { --exam-ink:#111827; --exam-muted:#475569; --exam-line:#cbd5e1; --exam-soft:#f8fafc; --exam-panel:#ffffff; }
    body { background:#eaf0f7; color:var(--exam-ink); }
    .exam-wrap { width:min(1040px, calc(100% - 32px)); margin:24px auto 60px; }
    .exam-controls { display:grid; gap:1rem; margin-bottom:1rem; }
    .exam-control-grid { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:0.75rem; align-items:end; }
    .exam-control-grid label { display:grid; gap:0.35rem; color:#34415a; font-size:0.86rem; font-weight:900; }
    .exam-control-actions { display:flex; flex-wrap:wrap; gap:0.6rem; }
    .paper, .answer-key { background:var(--exam-panel); box-shadow:0 18px 45px rgba(15,23,42,.12); padding:48px 58px; margin-bottom:26px; border-radius:24px; }
    .paper-title { display:flex; justify-content:space-between; gap:18px; border-bottom:2px solid var(--exam-ink); padding-bottom:16px; margin-bottom:26px; }
    .paper-title h1 { margin:0 0 6px; font-size:30px; letter-spacing:-0.04em; }
    .paper h2, .answer-key h2 { font-size:24px; margin:28px 0 12px; }
    .paper h3, .answer-key h3 { font-size:18px; margin:16px 0 10px; }
    .meta { color:var(--exam-muted); font-size:14px; line-height:1.4; }
    .marks { font-weight:900; white-space:nowrap; }
    .question-block { break-inside:avoid; page-break-inside:avoid; margin:18px 0 30px; padding-bottom:20px; border-bottom:1px solid #e2e8f0; }
    .question-head { font-weight:900; font-size:17px; margin-bottom:10px; }
    .part { display:grid; grid-template-columns:36px minmax(0,1fr); gap:8px; margin:12px 0; line-height:1.35; }
    .part-label { font-weight:800; }
    .digital-answer-wrap { grid-column:2; display:grid; gap:0.4rem; margin-top:0.55rem; }
    .digital-answer-wrap label { font-weight:900; color:#334155; font-size:0.86rem; }
    .digital-answer { width:100%; min-height:8.5rem; resize:vertical; border:1px solid var(--exam-line); border-radius:16px; padding:0.8rem 0.9rem; line-height:1.45; font:inherit; background:#fff; }
    .digital-answer:disabled { color:#0f172a; background:#f8fafc; }
    .answer-feedback { margin-top:0.8rem; border:1px solid rgba(148, 163, 184, 0.35); border-radius:16px; padding:0.85rem 1rem; background:#f8fafc; }
    .answer-feedback summary { cursor:pointer; font-weight:900; color:#0f172a; }
    .answer-feedback h4 { margin:0.85rem 0 0.25rem; font-size:0.9rem; text-transform:uppercase; letter-spacing:0.05em; color:#475569; }
    .answer-feedback p { margin:0.25rem 0 0; color:#334155; }
    .revision-mistakes { margin:0.35rem 0 0 18px; color:#334155; }
    .revision-mistakes li { margin:3px 0; }
    .revision-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .revision-links a, .revision-pill { display:inline-flex; align-items:center; border-radius:999px; padding:5px 9px; background:#e0f2fe; color:#075985; font-size:12px; font-weight:900; text-decoration:none; }
    .graph-instruction { margin:14px 0 7px; font-size:14px; }
    .graph-grid { position:relative; height:330px; border-left:3px solid #111; border-bottom:3px solid #111; border-top:1px solid #111; border-right:1px solid #111; background-color:#fff; background-image:linear-gradient(#d1d5db 1px, transparent 1px), linear-gradient(90deg, #d1d5db 1px, transparent 1px), linear-gradient(#eef2f7 1px, transparent 1px), linear-gradient(90deg, #eef2f7 1px, transparent 1px); background-size: calc(100% / 6) calc(100% / 7), calc(100% / 6) calc(100% / 7), calc(100% / 30) calc(100% / 35), calc(100% / 30) calc(100% / 35); }
    .axis-label { position:absolute; font-size:13px; color:#111; }
    .y-label { left:8px; top:8px; }
    .x-label { right:10px; bottom:8px; }
    .axis-numbers-x { display:grid; grid-template-columns:repeat(7,1fr); margin-left:-10px; font-size:12px; }
    .axis-numbers-x span { text-align:center; }
    .data-table { margin:10px 0 12px; line-height:1.8; }
    .answer-key .answer-item { margin:10px 0; line-height:1.35; }
    .answer-key h2 { border-bottom:2px solid var(--exam-ink); padding-bottom:10px; }
    .hidden { display:none !important; }
    @media (max-width: 860px) { .exam-control-grid { grid-template-columns:1fr 1fr; } .paper, .answer-key { padding:28px 22px; } .paper-title { flex-direction:column; } }
    @media (max-width: 620px) { .exam-control-grid { grid-template-columns:1fr; } .part { grid-template-columns:1fr; } .digital-answer-wrap { grid-column:1; } }
    @media print { body { background:#fff; } .topbar, .exam-controls, .answer-key.hidden { display:none !important; } .exam-wrap { width:auto; margin:0; } .paper, .answer-key { box-shadow:none; padding:0; margin:0; border-radius:0; } .answer-feedback { display:none; } .digital-answer { min-height:8rem; border:0; border-bottom:1px solid #4b5563; border-radius:0; } h2 { page-break-after:avoid; } .question-block { page-break-inside:avoid; } @page { size:A4; margin:14mm 16mm; } }
  </style>
</head>
<body>
  <canvas id="burstCanvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="wordmark" href="index.html" aria-label="Reaction home">
      <span class="wordmark-orbit" aria-hidden="true">✦</span>
      <span>
        <strong>Reaction</strong>
        <small>Year 9 Science Study</small>
      </span>
    </a>
    <nav class="top-actions" aria-label="App actions">
      <button id="soundToggle" class="soft-button" type="button" aria-pressed="true">Sound on</button>
      <button id="exportProgress" class="soft-button" type="button">Export</button>
      <label class="soft-button import-label" for="importProgressFile">Import</label>
      <input id="importProgressFile" type="file" accept="application/json" hidden>
    </nav>
  </header>

  <main class="exam-wrap">
    <section class="exam-controls panel" aria-label="Exam controls">
      <div class="section-heading-row compact-heading">
        <div>
          <p class="eyebrow">Exam mode</p>
          <h1>Digital-first 80-mark written paper</h1>
        </div>
        <p class="journey-hint">Type answers first. Submit to unlock expected answers, explanations, common mistakes and class-note links. Print / PDF is optional.</p>
      </div>
      <div class="exam-control-grid">
        <label>Paper type
          <select id="paperTypeSelect"><option value="normal">Normal 80-mark</option><option value="source">Source examples</option><option value="all">All available papers</option></select>
        </label>
        <label>Paper
          <select id="paperSelect"></select>
        </label>
        <label>Section
          <select id="sectionSelect"><option value="all">Full paper</option><option value="A">Section A only</option><option value="B">Section B only</option><option value="C">Section C only</option><option value="D">Section D only</option></select>
        </label>
        <label>Answer view
          <select id="answerModeSelect"><option value="revision">Revision answer key</option><option value="mark">Compact mark scheme</option></select>
        </label>
      </div>
      <div class="exam-control-actions">
        <button class="primary-button" id="submitPaperBtn" type="button">Submit paper</button>
        <button class="secondary-button" id="randomBtn" type="button">Random paper</button>
        <button class="secondary-button" id="printBtn" type="button">Print / Save PDF</button>
        <button class="secondary-button" id="toggleAnswersBtn" type="button" disabled>Answer key locked</button>
        <a class="secondary-button" href="index.html">Back to app</a>
      </div>
    </section>

    <section class="paper" id="paper"></section>
    <section class="answer-key hidden" id="answerKey"></section>
  </main>

  <script src="data/year9-exam-paper-bank.js?v=1.73.0"></script>
  <script>
    const bank = window.YEAR9_EXAM_PAPER_BANK || { papers: [] };
    const papers = Array.isArray(bank.papers) ? bank.papers : [];
    let paperTypeFilter = 'normal';
    let filteredPapers = papers.filter((p) => (p.paperType || 'normal') === paperTypeFilter);
    if (!filteredPapers.length) filteredPapers = papers;
    let paper = filteredPapers[0] || papers[0] || { sections: [] };
    let sectionFilter = 'all';
    let answerMode = 'revision';
    let paperSubmitted = false;
    let soundOn = true;
    let digitalAnswers = {};

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    const paperKey = () => paper.id || paper.title || 'paper';
    const answerKeyFor = (question, part) => `${paperKey()}::${question.number || ''}::${part.label || ''}`;
    const lineCountFor = (question) => Number(question.answerLines ?? Math.max(3, Math.ceil((question.marks || 6) * 0.8)));
    function activeSections() { return (paper.sections || []).filter((section) => sectionFilter === 'all' || section.id === sectionFilter); }
    function activeTotalMarks() { return activeSections().reduce((total, section) => total + section.questions.reduce((sum, question) => sum + Number(question.marks || 0), 0), 0); }
    function answerRowsFor(question) { return Math.max(4, Math.min(10, Math.ceil(lineCountFor(question) / Math.max(1, question.parts.length)))); }
    function renderGraph(graph) {
      if (!graph) return '';
      return `<div class="data-table"><strong>${escapeHtml(graph.xLabel.replace(/\s*\/.*/, ''))}:</strong> ${graph.xValues.join(' ')}<br><strong>${escapeHtml(graph.yLabel.replace(/\s*\/.*/, ''))}:</strong> ${graph.yValues.join(' ')}</div><p class="graph-instruction">${escapeHtml(graph.instruction || '')}</p><div class="graph-grid"><span class="axis-label y-label">${escapeHtml(graph.yLabel)}</span><span class="axis-label x-label">${escapeHtml(graph.xLabel)}</span></div><div class="axis-numbers-x">${graph.xValues.map((v) => `<span>${escapeHtml(v)}</span>`).join('')}</div>`;
    }
    function renderLearnMore(part) {
      const links = Array.isArray(part.learnMore) ? part.learnMore : [];
      const practice = Array.isArray(part.practice) ? part.practice : [];
      if (!links.length && !practice.length) return '<p>No class-note link is attached to this part yet.</p>';
      const linkHtml = links.map((link) => `<a href="${escapeHtml(link.href || 'index.html')}" target="_blank" rel="noopener">Class-note link: ${escapeHtml(link.title || 'Class notes')}</a>`).join('');
      const practiceHtml = practice.map((qid) => `<span class="revision-pill">Practise ${escapeHtml(qid)}</span>`).join('');
      return `<div class="revision-links">${linkHtml}${practiceHtml}</div>`;
    }
    function renderCommonMistakes(part) {
      const mistakes = Array.isArray(part.commonMistakes) ? part.commonMistakes.filter(Boolean) : [];
      const items = mistakes.length ? mistakes : ['Do not give a vague answer when the question asks for a named science idea.', 'Do not miss units, labels or comparative wording where the question asks for them.'];
      return `<ul class="revision-mistakes">${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
    }
    function renderPartFeedback(part) {
      if (!paperSubmitted) return '';
      return `<details class="answer-feedback" open>
        <summary>Answer key for part (${escapeHtml(part.label)})</summary>
        <h4>Expected answer</h4><p>${escapeHtml(part.answer || 'Check the mark scheme for the expected answer.')}</p>
        <h4>Why it is correct</h4><p>${escapeHtml(part.explanation || 'This answer matches the command word and uses the required science idea.')}</p>
        <h4>Common mistakes</h4>${renderCommonMistakes(part)}
        <h4>Class-note link</h4>${renderLearnMore(part)}
      </details>`;
    }
    function renderPart(question, part) {
      const key = answerKeyFor(question, part);
      const rows = answerRowsFor(question);
      const disabled = paperSubmitted ? 'disabled' : '';
      return `<div class="part"><div class="part-label">(${escapeHtml(part.label)})</div><div>${escapeHtml(part.prompt)}</div><div class="digital-answer-wrap"><label for="answer-${escapeHtml(key)}">Your written answer</label><textarea id="answer-${escapeHtml(key)}" class="digital-answer" data-answer-key="${escapeHtml(key)}" rows="${rows}" ${disabled} placeholder="Write your answer here before submitting the paper.">${escapeHtml(digitalAnswers[key] || '')}</textarea>${renderPartFeedback(part)}</div></div>`;
    }
    function renderQuestion(question) {
      return `<article class="question-block"><div class="question-head">${question.number}. ${escapeHtml(question.topic)}. <span class="marks">[${question.marks}]</span></div>${renderGraph(question.graph)}${question.parts.map((part) => renderPart(question, part)).join('')}</article>`;
    }
    function renderPaper() {
      const label = paper.variantLabel ? ` · ${paper.variantLabel}` : '';
      document.getElementById('paper').innerHTML = `<div class="paper-title"><div><h1>${escapeHtml(paper.title || 'Year 9 Science exam paper')}</h1><div class="meta">${escapeHtml(paper.subtitle || '')}${escapeHtml(label)}${paper.timeAllowed ? ` · Time allowed: ${escapeHtml(paper.timeAllowed)}` : ''}</div></div><div class="marks">Total: ${activeTotalMarks()} marks</div></div>${activeSections().map((section) => `<h2>${escapeHtml(section.title)}</h2>${section.questions.map(renderQuestion).join('')}`).join('')}`;
    }
    function renderRevisionPart(part) {
      return `<div class="answer-item"><strong>(${escapeHtml(part.label)}) Expected answer:</strong> ${escapeHtml(part.answer || '')}<br><em>${escapeHtml(part.explanation || '')}</em></div>`;
    }
    function renderAnswerKey() {
      const keyEl = document.getElementById('answerKey');
      keyEl.classList.toggle('hidden', !paperSubmitted);
      if (!paperSubmitted) { keyEl.innerHTML = ''; return; }
      if (answerMode === 'revision') {
        keyEl.innerHTML = `<h2>Revision answer key</h2><p class="meta">The same answer guidance is shown under each written answer above. This section keeps a compact reference at the end of the paper.</p>${activeSections().map((section) => `<h3>${escapeHtml(section.title)}</h3>${section.questions.map((question) => `<div class="answer-item"><strong>${question.number}. ${escapeHtml(question.topic)}</strong>${question.parts.map(renderRevisionPart).join('')}</div>`).join('')}`).join('')}`;
        return;
      }
      keyEl.innerHTML = `<h2>Compact mark scheme</h2>${activeSections().map((section) => `<h3>${escapeHtml(section.title)}</h3>${section.questions.map((question) => `<div class="answer-item"><strong>${question.number}.</strong> ${question.parts.map((part) => `<span><strong>(${escapeHtml(part.label)})</strong> ${escapeHtml(part.answer || '')}</span>`).join(' ')}</div>`).join('')}`).join('')}`;
    }
    function bindDigitalAnswerBoxes() {
      document.querySelectorAll('[data-answer-key]').forEach((box) => {
        box.addEventListener('input', () => { digitalAnswers[box.dataset.answerKey] = box.value; });
      });
    }
    function updateControlState() {
      const submit = document.getElementById('submitPaperBtn');
      const toggle = document.getElementById('toggleAnswersBtn');
      submit.textContent = paperSubmitted ? 'Paper submitted' : 'Submit paper';
      submit.disabled = paperSubmitted;
      toggle.disabled = !paperSubmitted;
      toggle.textContent = paperSubmitted && !document.getElementById('answerKey').classList.contains('hidden') ? 'Hide answer key' : (paperSubmitted ? 'Show answer key' : 'Answer key locked');
    }
    function renderAll() { renderPaper(); renderAnswerKey(); bindDigitalAnswerBoxes(); updateControlState(); }
    function papersForType() {
      const list = paperTypeFilter === 'all' ? papers : papers.filter((p) => (p.paperType || 'normal') === paperTypeFilter);
      return list.length ? list : papers;
    }
    function populatePaperSelect() {
      const select = document.getElementById('paperSelect');
      filteredPapers = papersForType();
      select.innerHTML = filteredPapers.map((p, index) => `<option value="${index}">${escapeHtml(p.variantLabel || p.title || `Paper ${index + 1}`)}</option>`).join('');
      paper = filteredPapers[0] || papers[0] || { sections: [] };
      select.value = '0';
    }
    function resetSubmission() { paperSubmitted = false; renderAll(); }
    function captureAnswers() {
      document.querySelectorAll('[data-answer-key]').forEach((box) => { digitalAnswers[box.dataset.answerKey] = box.value; });
    }
    function submitPaper() {
      captureAnswers();
      paperSubmitted = true;
      answerMode = 'revision';
      document.getElementById('answerModeSelect').value = 'revision';
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function exportProgress() {
      captureAnswers();
      const payload = { app: 'Reaction Year 9 Science', type: 'exam-paper-answers', exportedAt: new Date().toISOString(), paperId: paper.id || '', sectionFilter, answers: digitalAnswers };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reaction-exam-answers-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }
    function importProgress(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(String(reader.result || '{}'));
          if (payload.paperId) {
            const match = papers.find((candidate) => candidate.id === payload.paperId);
            if (match) {
              paperTypeFilter = match.paperType || 'normal';
              document.getElementById('paperTypeSelect').value = paperTypeFilter;
              populatePaperSelect();
              const index = filteredPapers.findIndex((candidate) => candidate.id === match.id);
              if (index >= 0) { document.getElementById('paperSelect').value = String(index); paper = filteredPapers[index]; }
            }
          }
          digitalAnswers = payload.answers && typeof payload.answers === 'object' ? payload.answers : {};
          paperSubmitted = false;
          renderAll();
        } catch (error) {
          alert('Could not import this exam answer file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    document.getElementById('paperTypeSelect').addEventListener('change', (event) => { paperTypeFilter = event.currentTarget.value; populatePaperSelect(); resetSubmission(); });
    document.getElementById('paperSelect').addEventListener('change', (event) => { paper = filteredPapers[Number(event.currentTarget.value)] || filteredPapers[0] || papers[0]; resetSubmission(); });
    document.getElementById('sectionSelect').addEventListener('change', (event) => { captureAnswers(); sectionFilter = event.currentTarget.value; resetSubmission(); });
    document.getElementById('answerModeSelect').addEventListener('change', (event) => { answerMode = event.currentTarget.value; renderAnswerKey(); updateControlState(); });
    document.getElementById('randomBtn').addEventListener('click', () => { filteredPapers = papersForType(); const next = Math.floor(Math.random() * filteredPapers.length); document.getElementById('paperSelect').value = String(next); paper = filteredPapers[next]; resetSubmission(); });
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('submitPaperBtn').addEventListener('click', submitPaper);
    document.getElementById('toggleAnswersBtn').addEventListener('click', () => { const key = document.getElementById('answerKey'); if (!paperSubmitted) return; key.classList.toggle('hidden'); updateControlState(); });
    document.getElementById('soundToggle').addEventListener('click', () => { soundOn = !soundOn; const btn = document.getElementById('soundToggle'); btn.textContent = soundOn ? 'Sound on' : 'Sound off'; btn.setAttribute('aria-pressed', String(soundOn)); });
    document.getElementById('exportProgress').addEventListener('click', exportProgress);
    document.getElementById('importProgressFile').addEventListener('change', importProgress);
    populatePaperSelect();
    renderAll();
  </script>
</body>
</html>
