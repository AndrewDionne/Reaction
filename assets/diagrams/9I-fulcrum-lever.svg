<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Lever and fulcrum</title>
  <desc id="desc">A simple lever resting on a triangular pivot labelled fulcrum.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fffdf8" stroke="#dfd8c8" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Lever vocabulary</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">The pivot point of a lever is called the fulcrum.</text>
  <g transform="translate(165 230)">
    <rect x="40" y="55" width="440" height="22" rx="10" fill="#c7965a" stroke="#9b6a33" stroke-width="3" transform="rotate(-8 260 66)"/>
    <polygon points="235,135 285,135 260,80" fill="#8aa4b7" stroke="#57738a" stroke-width="3"/>
    <circle cx="140" cy="88" r="24" fill="#d95c5c" stroke="#a83f3f" stroke-width="3"/>
    <text x="98" y="145" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">load</text>
    <line x1="258" y1="150" x2="258" y2="90" stroke="#57738a" stroke-width="2"/>
    <text x="230" y="182" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243447">fulcrum</text>
    <line x1="385" y1="50" x2="455" y2="15" stroke="#2e86de" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="390" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">effort</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e86de"/></marker></defs>
</svg>
