<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Sankey diagrams for machine efficiency</title>
  <desc id="desc">Two Sankey diagrams labelled X and Y, where Y has a larger useful output and a smaller wasted energy arrow, so it is more efficient.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fffdf8" stroke="#dfd8c8" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Which machine is more efficient?</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">The most efficient machine wastes the smallest proportion of the input energy.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243447">
    <text x="160" y="195">Machine X</text>
    <text x="160" y="345">Machine Y</text>
  </g>
  <g fill="#f0b54d" stroke="#d2941d" stroke-width="2">
    <path d="M170 215 H430 V255 H170 Z"/>
    <path d="M430 215 H520 V255 H430 Z"/>
    <path d="M430 255 V320 H490 V255 Z"/>
    <path d="M170 365 H490 V405 H170 Z"/>
    <path d="M490 365 H610 V405 H490 Z"/>
    <path d="M490 405 V440 H540 V405 Z"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">
    <text x="535" y="242">Useful output</text>
    <text x="498" y="300">Wasted</text>
    <text x="625" y="392">Useful output</text>
    <text x="548" y="438">Wasted</text>
  </g>
  <rect x="620" y="180" width="160" height="185" rx="16" fill="#ffffff" stroke="#dfd8c8" stroke-width="2"/>
  <text x="640" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243447">Answer idea</text>
  <text x="640" y="250" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">Machine Y is more</text>
  <text x="640" y="275" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">efficient because</text>
  <text x="640" y="300" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">the wasted-energy</text>
  <text x="640" y="325" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">arrow is smaller.</text>
</svg>
