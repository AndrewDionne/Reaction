<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Comparing levers</title>
  <desc id="desc">Three simple lever setups labelled A, B and C. Lever C has the longest effort arm and shortest load arm, making it easiest to lift the rock.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfdff" stroke="#c7d3e0" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Which lever makes the job easiest?</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">The easiest setup has the longest effort arm and the shortest load arm.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243447" text-anchor="middle">
    <text x="200" y="190">A</text><text x="450" y="190">B</text><text x="700" y="190">C</text>
  </g>
  <g transform="translate(80 0)">
    <g transform="translate(40 210)">
      <rect x="10" y="70" width="210" height="16" rx="8" fill="#c7965a" stroke="#9b6a33" stroke-width="3"/>
      <polygon points="100,105 130,105 115,75" fill="#8aa4b7" stroke="#57738a" stroke-width="3"/>
      <circle cx="40" cy="55" r="22" fill="#8d8d8d" stroke="#666" stroke-width="3"/>
      <line x1="190" y1="60" x2="190" y2="25" stroke="#2e86de" stroke-width="6" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(290 210)">
      <rect x="10" y="70" width="210" height="16" rx="8" fill="#c7965a" stroke="#9b6a33" stroke-width="3"/>
      <polygon points="115,105 145,105 130,75" fill="#8aa4b7" stroke="#57738a" stroke-width="3"/>
      <circle cx="50" cy="55" r="22" fill="#8d8d8d" stroke="#666" stroke-width="3"/>
      <line x1="190" y1="60" x2="190" y2="25" stroke="#2e86de" stroke-width="6" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(540 210)">
      <rect x="10" y="70" width="220" height="16" rx="8" fill="#c7965a" stroke="#9b6a33" stroke-width="3"/>
      <polygon points="70,105 100,105 85,75" fill="#8aa4b7" stroke="#57738a" stroke-width="3"/>
      <circle cx="35" cy="55" r="22" fill="#8d8d8d" stroke="#666" stroke-width="3"/>
      <line x1="210" y1="60" x2="210" y2="25" stroke="#2e86de" stroke-width="6" marker-end="url(#arrow)"/>
      <rect x="140" y="5" width="74" height="30" rx="14" fill="#dff3df" stroke="#7db77d" stroke-width="2"/>
      <text x="177" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2d7a32">best</text>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e86de"/></marker></defs>
  <text x="700" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">Lever C has the shortest load arm and the longest effort arm.</text>
</svg>
