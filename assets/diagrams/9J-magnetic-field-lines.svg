<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Magnetic field around a bar magnet</title>
<desc id="desc">A bar magnet labelled north and south with curved magnetic field lines outside the magnet.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfdff" stroke="#c7d3e0" stroke-width="2"/>
<text x="90" y="95" font-family="Arial" font-size="30" font-weight="700" fill="#243447">Magnetic field lines</text>
<text x="90" y="127" font-family="Arial" font-size="18" fill="#43576b">Outside the magnet, field lines go from north to south.</text>
<g transform="translate(180 170)">
  <rect x="150" y="130" width="240" height="70" rx="12" fill="#e67e22" stroke="#b85d13" stroke-width="3"/>
  <rect x="30" y="130" width="120" height="70" rx="12" fill="#3498db" stroke="#236a99" stroke-width="3"/>
  <text x="90" y="175" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#ffffff">N</text>
  <text x="270" y="175" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#ffffff">S</text>
  <g fill="none" stroke="#6b7f91" stroke-width="3" marker-end="url(#arr)">
    <path d="M50 125 C30 70, 50 15, 150 15 C285 15, 340 80, 390 125"/>
    <path d="M65 125 C60 85, 90 55, 150 55 C250 55, 300 85, 375 125"/>
    <path d="M50 205 C30 260, 50 315, 150 315 C285 315, 340 250, 390 205"/>
    <path d="M65 205 C60 245, 90 275, 150 275 C250 275, 300 245, 375 205"/>
  </g>
</g>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7f91"/></marker></defs>
</svg>