<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Plant diagram for photosynthesis</title>
  <desc id="desc">A simple labelled plant diagram showing a leaf, stem and roots. The green parts such as leaves and green stems are highlighted as the places where photosynthesis happens.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfff8" stroke="#cfe0c8" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Where does photosynthesis happen?</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">It happens in the green parts of the plant, especially the leaves and green stems.</text>
  <line x1="100" y1="420" x2="800" y2="420" stroke="#8b6f47" stroke-width="4"/>
  <g transform="translate(300 145)">
    <rect x="110" y="100" width="22" height="190" rx="10" fill="#5dae60" stroke="#438f46" stroke-width="2"/>
    <ellipse cx="85" cy="135" rx="62" ry="34" fill="#7ad37f" stroke="#4ca85c" stroke-width="2" transform="rotate(-18 85 135)"/>
    <ellipse cx="158" cy="165" rx="62" ry="34" fill="#7ad37f" stroke="#4ca85c" stroke-width="2" transform="rotate(18 158 165)"/>
    <ellipse cx="80" cy="230" rx="50" ry="28" fill="#8adf8e" stroke="#4ca85c" stroke-width="2" transform="rotate(-20 80 230)"/>
    <ellipse cx="165" cy="250" rx="50" ry="28" fill="#8adf8e" stroke="#4ca85c" stroke-width="2" transform="rotate(20 165 250)"/>
    <path d="M120 290 C112 330, 95 340, 80 380" stroke="#9b7a57" stroke-width="5" fill="none"/>
    <path d="M120 290 C128 330, 145 340, 160 380" stroke="#9b7a57" stroke-width="5" fill="none"/>
    <path d="M120 300 C120 338, 120 350, 120 388" stroke="#9b7a57" stroke-width="5" fill="none"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2c3e50" stroke="#8aa4b7" stroke-width="2">
    <circle cx="240" cy="215" r="23" fill="#ffffff"/><text x="240" y="222" text-anchor="middle">Q</text>
    <circle cx="560" cy="260" r="23" fill="#ffffff"/><text x="560" y="267" text-anchor="middle">R</text>
    <circle cx="245" cy="390" r="23" fill="#ffffff"/><text x="245" y="397" text-anchor="middle">P</text>
  </g>
  <g stroke="#607d8b" stroke-width="2">
    <line x1="262" y1="215" x2="385" y2="215"/><line x1="537" y1="260" x2="455" y2="260"/><line x1="267" y1="390" x2="405" y2="390"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">
    <text x="155" y="205">Q = leaf (green)</text>
    <text x="577" y="255">R = stem (green)</text>
    <text x="110" y="385">P = roots (not green)</text>
  </g>
  <rect x="610" y="330" width="180" height="110" rx="16" fill="#ffffff" stroke="#cfe0c8" stroke-width="2"/>
  <text x="630" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2d7a32">Key idea</text>
  <text x="630" y="396" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">Photosynthesis happens</text>
  <text x="630" y="420" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">in green tissues with</text>
  <text x="630" y="444" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">chloroplasts.</text>
</svg>
