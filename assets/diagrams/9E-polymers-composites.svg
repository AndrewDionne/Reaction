<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Polymers and composites</title>
<desc id="desc">A diagram comparing repeating polymer chains with a composite material made from a matrix and reinforcement.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfdff" stroke="#c7d3e0" stroke-width="2"/>
<text x="90" y="92" font-family="Arial" font-size="30" font-weight="700" fill="#243447">Polymers and composites</text>
<text x="90" y="124" font-family="Arial" font-size="18" fill="#43576b">Polymers are made from repeating units. Composites combine materials to get useful properties.</text>
<g transform="translate(120 175)">
  <text x="160" y="-15" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#243447">Polymer chains</text>
  <g fill="#9bc4ff" stroke="#5e86bf" stroke-width="2">
    <circle cx="30" cy="70" r="14"/><circle cx="75" cy="70" r="14"/><circle cx="120" cy="70" r="14"/><circle cx="165" cy="70" r="14"/><circle cx="210" cy="70" r="14"/><circle cx="255" cy="70" r="14"/>
    <circle cx="55" cy="125" r="14"/><circle cx="100" cy="125" r="14"/><circle cx="145" cy="125" r="14"/><circle cx="190" cy="125" r="14"/><circle cx="235" cy="125" r="14"/>
    <circle cx="30" cy="180" r="14"/><circle cx="75" cy="180" r="14"/><circle cx="120" cy="180" r="14"/><circle cx="165" cy="180" r="14"/><circle cx="210" cy="180" r="14"/><circle cx="255" cy="180" r="14"/>
  </g>
  <g stroke="#5e86bf" stroke-width="4">
    <line x1="44" y1="70" x2="61" y2="70"/><line x1="89" y1="70" x2="106" y2="70"/><line x1="134" y1="70" x2="151" y2="70"/><line x1="179" y1="70" x2="196" y2="70"/><line x1="224" y1="70" x2="241" y2="70"/>
    <line x1="69" y1="125" x2="86" y2="125"/><line x1="114" y1="125" x2="131" y2="125"/><line x1="159" y1="125" x2="176" y2="125"/><line x1="204" y1="125" x2="221" y2="125"/>
    <line x1="44" y1="180" x2="61" y2="180"/><line x1="89" y1="180" x2="106" y2="180"/><line x1="134" y1="180" x2="151" y2="180"/><line x1="179" y1="180" x2="196" y2="180"/><line x1="224" y1="180" x2="241" y2="180"/>
  </g>
</g>
<g transform="translate(500 170)">
  <text x="150" y="-10" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#243447">Composite material</text>
  <rect x="10" y="30" width="280" height="210" rx="18" fill="#eceff1" stroke="#9aa8b2" stroke-width="3"/>
  <g stroke="#e67e22" stroke-width="6">
    <line x1="35" y1="60" x2="265" y2="210"/>
    <line x1="35" y1="95" x2="265" y2="245"/>
    <line x1="35" y1="130" x2="230" y2="245"/>
    <line x1="65" y1="30" x2="290" y2="165"/>
  </g>
  <text x="20" y="275" font-family="Arial" font-size="18" fill="#43576b">grey = matrix</text>
  <text x="160" y="275" font-family="Arial" font-size="18" fill="#43576b">orange = reinforcement</text>
</g>
</svg>