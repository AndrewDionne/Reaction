<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img">
<rect width="900" height="560" fill="#ffffff"/>
<defs>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#243447}
.label{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#243447}
.small{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#43576b}
.axis{stroke:#2f3f4f;stroke-width:3;fill:none;stroke-linecap:round}
.grid{stroke:#d7e0ea;stroke-width:2}
.line{stroke:#2e86de;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire{stroke:#43576b;stroke-width:4.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tile{fill:#ffffff;stroke:#d7e0ea;stroke-width:2}
</style>
</defs>
<rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfdff" stroke="#d8e1ea" stroke-width="2"/>
<g transform="translate(110 105)">
<line class="axis" x1="80" y1="360" x2="720" y2="360"/><line class="axis" x1="80" y1="360" x2="80" y2="70"/>
<g class="grid"><line x1="80" y1="290" x2="720" y2="290"/><line x1="80" y1="220" x2="720" y2="220"/><line x1="80" y1="150" x2="720" y2="150"/><line x1="220" y1="70" x2="220" y2="360"/><line x1="360" y1="70" x2="360" y2="360"/><line x1="500" y1="70" x2="500" y2="360"/><line x1="640" y1="70" x2="640" y2="360"/></g>
<line x1="100" y1="340" x2="650" y2="110" stroke="#2e86de" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="340" x2="650" y2="250" stroke="#e67e22" stroke-width="7" stroke-linecap="round"/>
<text class="small" x="665" y="115" fill="#2e86de">resistor A</text><text class="small" x="665" y="255" fill="#e67e22">resistor B</text>
<text class="label" x="400" y="420" text-anchor="middle">voltage</text><text class="label" x="20" y="220" transform="rotate(-90 20 220)" text-anchor="middle">current</text>
</g>
