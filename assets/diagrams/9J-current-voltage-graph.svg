<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Current-voltage graph for two resistors</title>
  <desc id="desc">A graph of current against voltage with two straight lines, where the shallower line corresponds to the higher resistance.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfdff" stroke="#c7d3e0" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Current–voltage graph</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">A steeper line means more current for the same voltage, so the resistance is lower.</text>
  <line x1="130" y1="440" x2="770" y2="440" stroke="#2f3f4f" stroke-width="3"/>
  <line x1="130" y1="440" x2="130" y2="170" stroke="#2f3f4f" stroke-width="3"/>
  <text x="450" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#34495e">Voltage (V)</text>
  <text x="60" y="310" transform="rotate(-90 60 310)" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#34495e">Current (A)</text>
  <line x1="140" y1="430" x2="680" y2="200" stroke="#2e86de" stroke-width="7" stroke-linecap="round"/>
  <line x1="140" y1="430" x2="680" y2="320" stroke="#e67e22" stroke-width="7" stroke-linecap="round"/>
  <text x="610" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2e86de">Resistor A</text>
  <text x="610" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e67e22">Resistor B</text>
  <rect x="520" y="355" width="230" height="75" rx="16" fill="#ffffff" stroke="#c7d3e0" stroke-width="2"/>
  <text x="540" y="385" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#243447">Higher resistance?</text>
  <text x="540" y="410" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">B has the shallower line,</text>
  <text x="540" y="432" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">so B has the higher resistance.</text>
</svg>
