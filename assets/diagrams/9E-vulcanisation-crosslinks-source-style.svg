<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Vulcanisation source-style cross-linking diagram</title>
<desc id="desc">A before and after diagram showing natural rubber chains gaining cross-links during vulcanisation.</desc>
<rect width="900" height="560" fill="#fff"/>
<rect x="50" y="40" width="800" height="480" rx="22" fill="#fffdf8" stroke="#dfd8c8" stroke-width="2"/>
<text x="92" y="92" font-family="Arial" font-size="30" font-weight="700" fill="#213547">Vulcanisation</text>
<text x="92" y="124" font-family="Arial" font-size="18" fill="#4d6378">Cross-links make rubber harder and more useful while it remains elastic.</text>
<g font-family="Arial" fill="#213547"><text x="245" y="180" text-anchor="middle" font-size="24" font-weight="700">Before</text><text x="655" y="180" text-anchor="middle" font-size="24" font-weight="700">After vulcanisation</text></g>
<g transform="translate(100 215)" stroke-width="6" fill="none" stroke-linecap="round">
<path d="M20 40 C70 10, 100 80, 150 50 S230 20, 300 58" stroke="#8e6bd1"/>
<path d="M20 105 C80 70, 120 140, 180 100 S250 78, 315 120" stroke="#8e6bd1"/>
<path d="M20 170 C85 135, 110 205, 170 170 S245 135, 315 178" stroke="#8e6bd1"/>
</g>
<g transform="translate(500 215)" stroke-width="6" fill="none" stroke-linecap="round">
<path d="M20 40 C70 10, 100 80, 150 50 S230 20, 300 58" stroke="#8e6bd1"/>
<path d="M20 105 C80 70, 120 140, 180 100 S250 78, 315 120" stroke="#8e6bd1"/>
<path d="M20 170 C85 135, 110 205, 170 170 S245 135, 315 178" stroke="#8e6bd1"/>
<g stroke="#f39c12" stroke-width="5"><line x1="85" y1="55" x2="95" y2="110"/><line x1="160" y1="48" x2="170" y2="102"/><line x1="232" y1="62" x2="244" y2="118"/><line x1="90" y1="116" x2="85" y2="164"/><line x1="180" y1="104" x2="175" y2="168"/><line x1="260" y1="120" x2="248" y2="178"/></g>
</g>
<text x="245" y="445" text-anchor="middle" font-family="Arial" font-size="17" fill="#4d6378">Chains slide past each other easily.</text>
<text x="655" y="445" text-anchor="middle" font-family="Arial" font-size="17" fill="#4d6378">Cross-links stop chains sliding too much.</text>
</svg>