<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Forces on a falling object</title>
  <desc id="desc">A falling object with a downward arrow labelled X and an upward arrow labelled Y. Weight acts downward and air resistance acts upward.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfdff" stroke="#c7d3e0" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Falling object</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">Label the forces correctly: weight acts downward, air resistance acts upward.</text>
  <g transform="translate(430 165)">
    <ellipse cx="20" cy="120" rx="62" ry="74" fill="#9bc4ff" stroke="#5e86bf" stroke-width="3"/>
    <path d="M20 220 C5 260, 10 300, 20 330 C30 300, 35 260, 20 220" fill="#d8ebff" stroke="#5e86bf" stroke-width="3"/>
    <line x1="20" y1="15" x2="20" y2="-70" stroke="#d64541" stroke-width="7" marker-end="url(#arrowRed)"/>
    <line x1="20" y1="230" x2="20" y2="330" stroke="#2e86de" stroke-width="7" marker-end="url(#arrowBlue)"/>
    <text x="42" y="-20" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#d64541">Y</text>
    <text x="42" y="300" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2e86de">X</text>
  </g>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d64541"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e86de"/></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#43576b">
    <text x="140" y="220">Y = air resistance</text>
    <text x="140" y="252">(upwards, against the motion)</text>
    <text x="140" y="335">X = weight</text>
    <text x="140" y="367">(downwards, due to gravity)</text>
  </g>
</svg>
