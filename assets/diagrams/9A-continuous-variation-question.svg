<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title>Question diagram</title>
  <desc>Neutral Year 9 science diagram for a live question.</desc>
  <defs>
    <style>
      .bg { fill: #fbfff8; }
      .panel { fill: #ffffff; stroke: #d6e5d2; stroke-width: 2; }
      .axis { stroke: #475569; stroke-width: 3; stroke-linecap: round; }
      .grid { stroke: #e2e8f0; stroke-width: 1.5; }
      .line { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .green { fill: #86d18d; stroke: #327a3c; stroke-width: 3; }
      .blue { fill: #bfdbfe; stroke: #2563eb; stroke-width: 3; }
      .orange { fill: #fed7aa; stroke: #ea580c; stroke-width: 3; }
      .yellow { fill: #fde68a; stroke: #ca8a04; stroke-width: 3; }
      .red { fill: #fecaca; stroke: #dc2626; stroke-width: 3; }
      .grey { fill: #e5e7eb; stroke: #64748b; stroke-width: 3; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 22px; font-weight: 700; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #334155; font-size: 17px; font-weight: 600; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111827; font-size: 26px; font-weight: 800; }
      .muted { fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .thin { stroke-width: 2.5; }
      .wire { fill: none; stroke: #334155; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .chain { fill: none; stroke: #7c3aed; stroke-width: 4; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="760" height="430" rx="26" class="bg" />
  <rect x="24" y="24" width="712" height="382" rx="22" class="panel" />

  <g transform="translate(96 66)">
    <line class="axis" x1="0" y1="282" x2="548" y2="282" />
    <line class="axis" x1="0" y1="282" x2="0" y2="20" />
    <g opacity="0.9">
      <rect class="blue" x="50" y="222" width="54" height="60" rx="4" />
      <rect class="blue" x="110" y="178" width="54" height="104" rx="4" />
      <rect class="blue" x="170" y="120" width="54" height="162" rx="4" />
      <rect class="blue" x="230" y="72" width="54" height="210" rx="4" />
      <rect class="blue" x="290" y="96" width="54" height="186" rx="4" />
      <rect class="blue" x="350" y="156" width="54" height="126" rx="4" />
      <rect class="blue" x="410" y="220" width="54" height="62" rx="4" />
    </g>
    <path class="line" d="M 36 260 C 88 238, 122 184, 170 130 C 222 72, 282 48, 340 98 C 390 142, 428 212, 488 262" />
    <text class="small" x="192" y="328">Measurement</text>
    <text class="small" transform="rotate(-90)" x="-225" y="-48">Number of students</text>
  </g>

</svg>
