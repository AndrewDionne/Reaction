<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Animal feature suggesting prey</title>
<desc id="desc">Four animal feature options. The spiny animal is highlighted as the feature that suggests prey because spines defend against predators.</desc>
<rect width="900" height="560" fill="#fff"/>
<rect x="50" y="40" width="800" height="480" rx="22" fill="#fbfff8" stroke="#cfe0c8" stroke-width="2"/>
<text x="92" y="92" font-family="Arial" font-size="29" font-weight="700" fill="#213547">Which feature suggests an animal is prey?</text>
<text x="92" y="124" font-family="Arial" font-size="18" fill="#4d6378">Defensive structures help protect animals from predators.</text>
<g font-family="Arial" font-size="22" font-weight="700" fill="#213547" text-anchor="middle"><text x="185" y="178">A</text><text x="365" y="178">B</text><text x="545" y="178">C</text><text x="725" y="178">D</text></g>
<g transform="translate(110 205)">
<g transform="translate(0 0)"><rect width="145" height="150" rx="16" fill="#fff" stroke="#2d7a32" stroke-width="4"/><ellipse cx="72" cy="90" rx="45" ry="28" fill="#b58b62"/><g stroke="#4f3b2b" stroke-width="4"><line x1="35" y1="70" x2="18" y2="45"/><line x1="55" y1="62" x2="50" y2="34"/><line x1="75" y1="60" x2="80" y2="30"/><line x1="95" y1="65" x2="108" y2="38"/><line x1="112" y1="78" x2="132" y2="55"/></g><circle cx="48" cy="84" r="4" fill="#000"/></g>
<g transform="translate(180 0)"><rect width="145" height="150" rx="16" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><ellipse cx="72" cy="80" rx="38" ry="32" fill="#cfa57a"/><path d="M100 78 C122 62,128 48,132 34" stroke="#8f633b" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="60" cy="72" r="4" fill="#000"/></g>
<g transform="translate(360 0)"><rect width="145" height="150" rx="16" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><ellipse cx="72" cy="84" rx="38" ry="30" fill="#cfa57a"/><ellipse cx="45" cy="58" rx="12" ry="20" fill="#b88e62"/><ellipse cx="100" cy="58" rx="12" ry="20" fill="#b88e62"/><circle cx="58" cy="78" r="4" fill="#000"/></g>
<g transform="translate(540 0)"><rect width="145" height="150" rx="16" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><ellipse cx="72" cy="84" rx="38" ry="30" fill="#cfa57a"/><g stroke="#111" stroke-width="2"><line x1="45" y1="82" x2="15" y2="66"/><line x1="45" y1="88" x2="13" y2="88"/><line x1="45" y1="94" x2="15" y2="111"/><line x1="100" y1="82" x2="130" y2="66"/><line x1="100" y1="88" x2="132" y2="88"/><line x1="100" y1="94" x2="130" y2="111"/></g><circle cx="58" cy="78" r="4" fill="#000"/></g>
</g>
<rect x="270" y="420" width="360" height="58" rx="16" fill="#fff" stroke="#cfe0c8" stroke-width="2"/>
<text x="450" y="445" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#213547">A: spines on its body</text>
<text x="450" y="467" text-anchor="middle" font-family="Arial" font-size="16" fill="#4d6378">Spines are a defence against predators.</text>
</svg>