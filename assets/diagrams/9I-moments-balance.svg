<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Moments and balance</title>
<desc id="desc">A balanced beam with clockwise and anticlockwise moments, and the formula moment equals force times distance.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="50" y="40" width="800" height="480" rx="24" fill="#fffdf8" stroke="#dfd8c8" stroke-width="2"/>
<text x="90" y="92" font-family="Arial" font-size="30" font-weight="700" fill="#243447">Moments</text>
<text x="90" y="124" font-family="Arial" font-size="18" fill="#43576b">Moment = force × perpendicular distance from the pivot.</text>
<g transform="translate(130 210)">
  <rect x="70" y="90" width="470" height="18" rx="9" fill="#c7965a" stroke="#9b6a33" stroke-width="3"/>
  <polygon points="285,150 325,150 305,108" fill="#8aa4b7" stroke="#57738a" stroke-width="3"/>
  <line x1="170" y1="65" x2="170" y2="88" stroke="#d64541" stroke-width="6" marker-end="url(#downR)"/>
  <line x1="440" y1="65" x2="440" y2="88" stroke="#2e86de" stroke-width="6" marker-end="url(#downB)"/>
  <text x="140" y="55" font-family="Arial" font-size="18" fill="#d64541">10 N</text>
  <text x="410" y="55" font-family="Arial" font-size="18" fill="#2e86de">5 N</text>
  <text x="125" y="135" font-family="Arial" font-size="17" fill="#43576b">0.1 m</text>
  <text x="430" y="135" font-family="Arial" font-size="17" fill="#43576b">0.2 m</text>
  <path d="M205 165 A70 70 0 0 1 295 165" fill="none" stroke="#d64541" stroke-width="4" marker-end="url(#arrR)"/>
  <path d="M410 165 A70 70 0 0 0 320 165" fill="none" stroke="#2e86de" stroke-width="4" marker-end="url(#arrB)"/>
  <text x="140" y="205" font-family="Arial" font-size="18" fill="#43576b">clockwise moment = 1 N·m</text>
  <text x="350" y="205" font-family="Arial" font-size="18" fill="#43576b">anticlockwise moment = 1 N·m</text>
</g>
<defs>
<marker id="downR" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d64541"/></marker>
<marker id="downB" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e86de"/></marker>
<marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d64541"/></marker>
<marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e86de"/></marker>
</defs>
</svg>