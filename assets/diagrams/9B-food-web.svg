<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Simple food web with insects and wrens</title>
  <desc id="desc">A rose bush feeds insects, which are eaten by wrens. A note explains that fewer insects means fewer wrens.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfff8" stroke="#cfe0c8" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Food web idea</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">Arrows show the direction of energy transfer.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <g>
      <rect x="120" y="220" width="170" height="90" rx="18" fill="#d9f2d9" stroke="#78b478" stroke-width="3"/>
      <text x="205" y="275" fill="#2e6e2e">Rose bush</text>
    </g>
    <g>
      <rect x="370" y="220" width="170" height="90" rx="18" fill="#fff3c7" stroke="#caa34a" stroke-width="3"/>
      <text x="455" y="265" fill="#8b5a00">Insects</text>
      <text x="455" y="292" fill="#8b5a00" font-size="16" font-weight="400">(e.g. aphids)</text>
    </g>
    <g>
      <rect x="620" y="220" width="170" height="90" rx="18" fill="#dde8ff" stroke="#7d98c2" stroke-width="3"/>
      <text x="705" y="275" fill="#2f4f7f">Wrens</text>
    </g>
  </g>
  <g stroke="#6f7f8f" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="290" y1="265" x2="370" y2="265"/>
    <line x1="540" y1="265" x2="620" y2="265"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6f7f8f"/></marker></defs>
  <rect x="190" y="360" width="520" height="90" rx="18" fill="#ffffff" stroke="#cfe0c8" stroke-width="2"/>
  <text x="450" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#243447">If insecticide reduces insect numbers...</text>
  <text x="450" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#43576b">...there is less food for wrens, so wren numbers go down.</text>
</svg>
