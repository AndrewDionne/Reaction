<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Triceratops adaptation label model</title>
  <desc id="desc">A simplified Triceratops model with blank callout points for adaptations.</desc>
  <rect width="900" height="560" fill="#fff"/>
  <rect x="55" y="40" width="790" height="480" rx="22" fill="#fbfdff" stroke="#d5dde8" stroke-width="2"/>
  <text x="95" y="92" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#243447">Triceratops model</text>
  <text x="95" y="122" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52667a">Identify adaptations that could be labelled on the model.</text>
  <g transform="translate(155 180)">
    <ellipse cx="290" cy="180" rx="210" ry="85" fill="#cfd8dc" stroke="#7f8c8d" stroke-width="4"/>
    <ellipse cx="470" cy="120" rx="95" ry="78" fill="#d9e2e5" stroke="#7f8c8d" stroke-width="4"/>
    <path d="M520 95 L650 70 L535 120 Z" fill="#e8eef0" stroke="#7f8c8d" stroke-width="4"/>
    <path d="M455 92 L438 5 L480 88 Z" fill="#eef3f5" stroke="#7f8c8d" stroke-width="4"/>
    <path d="M500 95 L545 15 L522 105 Z" fill="#eef3f5" stroke="#7f8c8d" stroke-width="4"/>
    <path d="M558 130 L638 150 L555 152 Z" fill="#eef3f5" stroke="#7f8c8d" stroke-width="4"/>
    <path d="M120 172 C50 165, 42 198, 95 210" fill="none" stroke="#7f8c8d" stroke-width="14" stroke-linecap="round"/>
    <g stroke="#7f8c8d" stroke-width="12" stroke-linecap="round"><line x1="210" y1="242" x2="190" y2="315"/><line x1="340" y1="245" x2="330" y2="318"/><line x1="420" y1="238" x2="425" y2="310"/></g>
    <circle cx="500" cy="112" r="6" fill="#243447"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#52667a" stroke="#607d8b" stroke-width="2">
      <line x1="455" y1="35" x2="260" y2="-20"/><text x="70" y="-22" stroke="none">Feature A: ________</text>
      <line x1="520" y1="70" x2="610" y2="-15"/><text x="615" y="-12" stroke="none">Feature B: ________</text>
      <line x1="638" y1="150" x2="700" y2="130"/><text x="705" y="135" stroke="none">Feature C: ________</text>
      <line x1="225" y1="245" x2="90" y2="330"/><text x="0" y="355" stroke="none">Feature D: ________</text>
    </g>
  </g>
</svg>