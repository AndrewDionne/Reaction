<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Series and parallel circuits</title>
  <desc id="desc">A simple series circuit and a simple parallel circuit, used to compare how current behaves.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fffdf8" stroke="#dfd8c8" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Series and parallel circuits</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">Current is the same everywhere in series, but it splits between branches in parallel.</text>
  <g transform="translate(110 180)">
    <text x="160" y="-15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#243447">Series</text>
    <path d="M20 20 H300 V160 H20 Z" fill="none" stroke="#43576b" stroke-width="4"/>
    <rect x="130" y="12" width="60" height="16" fill="#ecf0f1" stroke="#43576b" stroke-width="3"/>
    <circle cx="95" cy="90" r="18" fill="#ffe082" stroke="#c79a2d" stroke-width="3"/>
    <circle cx="225" cy="90" r="18" fill="#ffe082" stroke="#c79a2d" stroke-width="3"/>
    <path d="M20 90 H70" fill="none" stroke="#43576b" stroke-width="4"/>
    <path d="M113 90 H207" fill="none" stroke="#43576b" stroke-width="4"/>
    <path d="M243 90 H300" fill="none" stroke="#43576b" stroke-width="4"/>
  </g>
  <g transform="translate(470 180)">
    <text x="160" y="-15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#243447">Parallel</text>
    <path d="M20 20 H300 V160 H20 Z" fill="none" stroke="#43576b" stroke-width="4"/>
    <rect x="130" y="12" width="60" height="16" fill="#ecf0f1" stroke="#43576b" stroke-width="3"/>
    <path d="M70 55 H250" fill="none" stroke="#43576b" stroke-width="4"/>
    <path d="M70 125 H250" fill="none" stroke="#43576b" stroke-width="4"/>
    <circle cx="160" cy="55" r="18" fill="#ffe082" stroke="#c79a2d" stroke-width="3"/>
    <circle cx="160" cy="125" r="18" fill="#ffe082" stroke="#c79a2d" stroke-width="3"/>
    <path d="M70 20 V160" fill="none" stroke="#43576b" stroke-width="4"/>
    <path d="M250 20 V160" fill="none" stroke="#43576b" stroke-width="4"/>
  </g>
</svg>
