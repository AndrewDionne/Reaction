<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Leaf, xylem and phloem support diagram</title>
<desc id="desc">A leaf cross-section and a simple stem transport diagram showing xylem carrying water up and phloem carrying sugars around the plant.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfff8" stroke="#cfe0c8" stroke-width="2"/>
<text x="90" y="92" font-family="Arial" font-size="30" font-weight="700" fill="#243447">Leaf and transport tissues</text>
<text x="90" y="124" font-family="Arial" font-size="18" fill="#43576b">Xylem carries water and minerals upward. Phloem carries dissolved sugars to where they are needed.</text>
<g transform="translate(110 170)">
  <path d="M20 120 C90 20, 250 10, 340 120 C250 230, 90 220, 20 120 Z" fill="#7bd67f" stroke="#47a44b" stroke-width="4"/>
  <path d="M20 120 C90 20, 250 10, 340 120" fill="none" stroke="#2d7a32" stroke-width="3"/>
  <line x1="30" y1="120" x2="330" y2="120" stroke="#2d7a32" stroke-width="3"/>
  <ellipse cx="180" cy="120" rx="85" ry="34" fill="#a4e8a7" stroke="#4ca85c" stroke-width="2"/>
  <text x="180" y="127" text-anchor="middle" font-family="Arial" font-size="16" fill="#243447">vein</text>
  <text x="180" y="265" text-anchor="middle" font-family="Arial" font-size="20" fill="#243447">Leaf</text>
</g>
<g transform="translate(520 175)">
  <rect x="75" y="20" width="70" height="220" rx="20" fill="#d7f0ff" stroke="#7aa7d9" stroke-width="3"/>
  <rect x="160" y="20" width="70" height="220" rx="20" fill="#ffe7c8" stroke="#d5a25a" stroke-width="3"/>
  <text x="110" y="270" text-anchor="middle" font-family="Arial" font-size="20" fill="#243447">xylem</text>
  <text x="195" y="270" text-anchor="middle" font-family="Arial" font-size="20" fill="#243447">phloem</text>
  <line x1="110" y1="210" x2="110" y2="60" stroke="#2e86de" stroke-width="6" marker-end="url(#up)"/>
  <line x1="195" y1="60" x2="195" y2="180" stroke="#e67e22" stroke-width="6" marker-end="url(#down)"/>
  <text x="20" y="95" font-family="Arial" font-size="18" fill="#43576b">water + minerals</text>
  <text x="18" y="120" font-family="Arial" font-size="18" fill="#43576b">move upward</text>
  <text x="250" y="95" font-family="Arial" font-size="18" fill="#43576b">sugars move to</text>
  <text x="250" y="120" font-family="Arial" font-size="18" fill="#43576b">where needed</text>
</g>
<defs>
  <marker id="up" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,6 L9,3 L0,0 z" fill="#2e86de"/></marker>
  <marker id="down" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#e67e22"/></marker>
</defs>
</svg>