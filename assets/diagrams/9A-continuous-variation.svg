<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Continuous variation and normal distribution</title>
  <desc id="desc">A chart showing continuous variation with a histogram and a bell-shaped distribution curve.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#f8fbff" stroke="#c9d6e5" stroke-width="2"/>
  <text x="90" y="96" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#243447">Continuous variation</text>
  <text x="90" y="130" font-family="Arial, sans-serif" font-size="18" fill="#40566f">Measurements can take any value over a range.</text>

  <!-- axes -->
  <line x1="120" y1="430" x2="700" y2="430" stroke="#243447" stroke-width="3"/>
  <line x1="120" y1="430" x2="120" y2="170" stroke="#243447" stroke-width="3"/>
  <text x="410" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#243447">Measurement (for example: height)</text>
  <text x="62" y="285" transform="rotate(-90 62 285)" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#243447">Number of students</text>
  <text x="160" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#40566f">shorter</text>
  <text x="435" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#40566f">average</text>
  <text x="650" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#40566f">taller</text>

  <!-- histogram -->
  <rect x="150" y="390" width="62" height="40" fill="#8fc1f5" stroke="#5689bf" stroke-width="2"/>
  <rect x="220" y="350" width="62" height="80" fill="#8fc1f5" stroke="#5689bf" stroke-width="2"/>
  <rect x="290" y="300" width="62" height="130" fill="#8fc1f5" stroke="#5689bf" stroke-width="2"/>
  <rect x="360" y="240" width="62" height="190" fill="#8fc1f5" stroke="#5689bf" stroke-width="2"/>
  <rect x="430" y="220" width="62" height="210" fill="#8fc1f5" stroke="#5689bf" stroke-width="2"/>
  <rect x="500" y="250" width="62" height="180" fill="#8fc1f5" stroke="#5689bf" stroke-width="2"/>
  <rect x="570" y="315" width="62" height="115" fill="#8fc1f5" stroke="#5689bf" stroke-width="2"/>
  <rect x="640" y="380" width="62" height="50" fill="#8fc1f5" stroke="#5689bf" stroke-width="2"/>
  <path d="M150 398 C220 360 250 285 330 245 C410 205 475 188 555 240 C610 276 655 340 702 400" fill="none" stroke="#ef4337" stroke-width="6" stroke-linecap="round"/>
  <circle cx="440" cy="220" r="6" fill="#ef4337"/>

  <!-- wrapped note -->
  <text x="650" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#c0392b">Normal distribution</text>
  <text x="650" y="215" font-family="Arial, sans-serif" font-size="16" fill="#40566f">The overall bell shape is</text>
  <text x="650" y="238" font-family="Arial, sans-serif" font-size="16" fill="#40566f">called a normal distribution.</text>
</svg>
