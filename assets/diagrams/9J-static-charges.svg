<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Static charges: attract and repel</title>
<desc id="desc">Charged rods and suspended pith balls showing like charges repel and opposite charges attract.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="50" y="40" width="800" height="480" rx="24" fill="#fffdf8" stroke="#dfd8c8" stroke-width="2"/>
<text x="90" y="95" font-family="Arial" font-size="30" font-weight="700" fill="#243447">Static electricity</text>
<text x="90" y="127" font-family="Arial" font-size="18" fill="#43576b">Like charges repel. Opposite charges attract.</text>
<g transform="translate(120 190)">
  <text x="180" y="-20" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#243447">Repel</text>
  <circle cx="130" cy="110" r="40" fill="#ffdddd" stroke="#d64541" stroke-width="3"/><text x="130" y="121" text-anchor="middle" font-family="Arial" font-size="34" fill="#d64541">−</text>
  <circle cx="250" cy="110" r="40" fill="#ffdddd" stroke="#d64541" stroke-width="3"/><text x="250" y="121" text-anchor="middle" font-family="Arial" font-size="34" fill="#d64541">−</text>
  <path d="M168 110 H205" stroke="#6b7f91" stroke-width="4" marker-end="url(#a1)"/>
  <path d="M212 110 H175" stroke="#6b7f91" stroke-width="4" marker-end="url(#a2)"/>
</g>
<g transform="translate(470 190)">
  <text x="180" y="-20" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#243447">Attract</text>
  <circle cx="130" cy="110" r="40" fill="#ffdddd" stroke="#d64541" stroke-width="3"/><text x="130" y="121" text-anchor="middle" font-family="Arial" font-size="34" fill="#d64541">−</text>
  <circle cx="250" cy="110" r="40" fill="#ddeeff" stroke="#2e86de" stroke-width="3"/><text x="250" y="121" text-anchor="middle" font-family="Arial" font-size="34" fill="#2e86de">+</text>
  <path d="M170 110 H210" stroke="#6b7f91" stroke-width="4" marker-end="url(#a1)"/>
  <path d="M210 110 H170" stroke="#6b7f91" stroke-width="4" marker-end="url(#a2)"/>
</g>
<defs>
<marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7f91"/></marker>
<marker id="a2" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#6b7f91"/></marker>
</defs>
</svg>