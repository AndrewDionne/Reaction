<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Reactivity and extraction methods</title>
<desc id="desc">A ranked reactivity series showing that metals above carbon need electrolysis, while some below carbon can be extracted by reduction with carbon.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="50" y="40" width="800" height="480" rx="24" fill="#fffdf8" stroke="#dfd8c8" stroke-width="2"/>
<text x="90" y="92" font-family="Arial" font-size="30" font-weight="700" fill="#243447">Reactivity and extraction</text>
<text x="90" y="124" font-family="Arial" font-size="18" fill="#43576b">The position of a metal in the reactivity series helps decide how it is extracted.</text>
<g transform="translate(135 165)" font-family="Arial" font-size="20">
  <text x="0" y="-20" font-weight="700" fill="#243447">More reactive</text>
  <g>
    <rect x="0" y="0" width="170" height="40" fill="#fbe0e0" stroke="#d18c8c"/><text x="85" y="26" text-anchor="middle" fill="#243447">potassium</text>
    <rect x="0" y="40" width="170" height="40" fill="#fce8d6" stroke="#d5a25a"/><text x="85" y="66" text-anchor="middle" fill="#243447">sodium</text>
    <rect x="0" y="80" width="170" height="40" fill="#fce8d6" stroke="#d5a25a"/><text x="85" y="106" text-anchor="middle" fill="#243447">calcium</text>
    <rect x="0" y="120" width="170" height="40" fill="#fce8d6" stroke="#d5a25a"/><text x="85" y="146" text-anchor="middle" fill="#243447">magnesium</text>
    <rect x="0" y="160" width="170" height="40" fill="#fce8d6" stroke="#d5a25a"/><text x="85" y="186" text-anchor="middle" fill="#243447">aluminium</text>
    <rect x="0" y="200" width="170" height="40" fill="#fff2b8" stroke="#c5b15c"/><text x="85" y="226" text-anchor="middle" fill="#243447">carbon</text>
    <rect x="0" y="240" width="170" height="40" fill="#dff3df" stroke="#7db77d"/><text x="85" y="266" text-anchor="middle" fill="#243447">zinc</text>
    <rect x="0" y="280" width="170" height="40" fill="#dff3df" stroke="#7db77d"/><text x="85" y="306" text-anchor="middle" fill="#243447">iron</text>
    <rect x="0" y="320" width="170" height="40" fill="#dff3df" stroke="#7db77d"/><text x="85" y="346" text-anchor="middle" fill="#243447">copper</text>
  </g>
</g>
<g transform="translate(380 185)" font-family="Arial" font-size="20" fill="#243447">
  <rect x="0" y="0" width="330" height="110" rx="18" fill="#ffffff" stroke="#d18c8c" stroke-width="2"/>
  <text x="20" y="35" font-weight="700">Above carbon</text>
  <text x="20" y="65">Too reactive to extract using carbon.</text>
  <text x="20" y="92">Usually extracted by electrolysis.</text>
  <rect x="0" y="145" width="330" height="110" rx="18" fill="#ffffff" stroke="#7db77d" stroke-width="2"/>
  <text x="20" y="180" font-weight="700">Below carbon</text>
  <text x="20" y="210">Can often be extracted by heating</text>
  <text x="20" y="237">the oxide with carbon.</text>
</g>
</svg>