<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">Circuit symbol grid</title><desc id="desc">Eight circuit symbols labelled A to H for an identification task.</desc><rect width="900" height="640" fill="#ffffff"/>
<rect x="44" y="36" width="812" height="568" rx="24" fill="#fbfdff" stroke="#c7d3e0" stroke-width="2"/>
<text x="450" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Circuit symbols</text>
<text x="450" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5f6f82">Use the letter labels to identify each component.</text>
<defs><style>.wire{stroke:#30485f;stroke-width:5;stroke-linecap:round;fill:none}.sym{stroke:#30485f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.label{font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;fill:#243447}.small{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#30485f}.tile{fill:#ffffff;stroke:#d7e0ea;stroke-width:2}</style></defs>
<g transform="translate(80 155)">
  <g transform="translate(0 0)"><rect class="tile" x="0" y="0" width="170" height="135" rx="18"/><text class="label" x="18" y="32">A</text><path class="wire" d="M35 76 H70"/><line class="sym" x1="70" y1="52" x2="70" y2="100"/><line class="sym" x1="90" y1="62" x2="90" y2="90"/><path class="wire" d="M90 76 H135"/></g>
  <g transform="translate(190 0)"><rect class="tile" x="0" y="0" width="170" height="135" rx="18"/><text class="label" x="18" y="32">B</text><path class="wire" d="M35 82 H78"/><circle cx="78" cy="82" r="4" fill="#30485f"/><path class="sym" d="M82 78 L120 54"/><circle cx="128" cy="82" r="4" fill="#30485f"/><path class="wire" d="M128 82 H140"/></g>
  <g transform="translate(380 0)"><rect class="tile" x="0" y="0" width="170" height="135" rx="18"/><text class="label" x="18" y="32">C</text><path class="wire" d="M35 82 H78"/><circle cx="78" cy="82" r="4" fill="#30485f"/><path class="sym" d="M82 80 L126 80"/><circle cx="128" cy="82" r="4" fill="#30485f"/><path class="wire" d="M128 82 H140"/></g>
  <g transform="translate(570 0)"><rect class="tile" x="0" y="0" width="170" height="135" rx="18"/><text class="label" x="18" y="32">D</text><path class="wire" d="M35 82 H60"/><circle class="sym" cx="86" cy="82" r="25"/><path class="sym" d="M68 64 L104 100"/><path class="sym" d="M104 64 L68 100"/><path class="wire" d="M112 82 H140"/></g>
  <g transform="translate(0 165)"><rect class="tile" x="0" y="0" width="170" height="135" rx="18"/><text class="label" x="18" y="32">E</text><path class="wire" d="M35 82 H62"/><path class="sym" d="M62 82 L70 62 L82 102 L94 62 L106 102 L118 62 L126 82"/><path class="wire" d="M126 82 H140"/></g>
  <g transform="translate(190 165)"><rect class="tile" x="0" y="0" width="170" height="135" rx="18"/><text class="label" x="18" y="32">F</text><path class="wire" d="M35 82 H58"/><circle class="sym" cx="86" cy="82" r="31"/><text class="small" x="86" y="90" text-anchor="middle">V</text><path class="wire" d="M114 82 H140"/></g>
  <g transform="translate(380 165)"><rect class="tile" x="0" y="0" width="170" height="135" rx="18"/><text class="label" x="18" y="32">G</text><path class="wire" d="M35 82 H58"/><circle class="sym" cx="86" cy="82" r="31"/><text class="small" x="86" y="90" text-anchor="middle">A</text><path class="wire" d="M114 82 H140"/></g>
  <g transform="translate(570 165)"><rect class="tile" x="0" y="0" width="170" height="135" rx="18"/><text class="label" x="18" y="32">H</text><path class="wire" d="M35 82 H58"/><circle class="sym" cx="86" cy="82" r="31"/><text class="small" x="86" y="90" text-anchor="middle">M</text><path class="wire" d="M114 82 H140"/></g>
</g>
</svg>