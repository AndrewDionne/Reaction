<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Blast furnace process note diagram</title>
<desc id="desc">A clean labelled blast furnace note diagram with non-overlapping callouts.</desc>
<rect width="1600" height="1000" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#30465f"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/></marker>
  <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#ea580c"/></marker>
  <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#15803d"/></marker>
<style>
  .title{font-family:Arial,Helvetica,sans-serif;font-size:52px;font-weight:800;fill:#1f2f46}
  .sub{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#52667a}
  .label{font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:750;fill:#223247}
  .text{font-family:Arial,Helvetica,sans-serif;font-size:26px;fill:#223247}
  .small{font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#516477}
  .tiny{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#516477}
  .badgeText{font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:800;fill:#ffffff}
  .card{fill:#fbfdff;stroke:#c7d3e0;stroke-width:4}
  .panelBlue{fill:#eef6ff;stroke:#93c5fd;stroke-width:4}
  .panelGreen{fill:#eefbf3;stroke:#9bd0a6;stroke-width:4}
  .panelAmber{fill:#fff8e6;stroke:#e8c96d;stroke-width:4}
  .panelGrey{fill:#f6f8fb;stroke:#ccd7e2;stroke-width:4}
  .callout{fill:#ffffff;stroke:#cad6e2;stroke-width:4}
  .chipBlue{fill:#e0f2fe;stroke:#7dd3fc;stroke-width:3}
  .chipAmber{fill:#fff7ed;stroke:#fdba74;stroke-width:3}
  .chipGreen{fill:#ecfdf5;stroke:#86efac;stroke-width:3}
  .chipLav{fill:#eef2ff;stroke:#a5b4fc;stroke-width:3}
  .wire{stroke:#30465f;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sym{stroke:#30465f;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#516477;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .measure{stroke:#64748b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8}
  .dash{stroke:#64748b;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 10}

  .arrow{stroke:#30465f;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  .arrowBlue{stroke:#2563eb;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
  .arrowOrange{stroke:#ea580c;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
  .arrowGreen{stroke:#15803d;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
</style></defs>
<rect x="70" y="60" width="1460" height="880" rx="38" class="card"/>

<text x="130" y="140" class="title">Blast furnace process</text>
<text x="130" y="186" class="sub">Clear note diagram showing the main inputs, products and reduction step.</text>
<g transform="translate(520 205)">
  <path d="M160 35 C95 180 85 470 160 670 L430 670 C505 470 495 180 430 35 Z" fill="#f8fafc" stroke="#334155" stroke-width="8"/>
  <path d="M198 135 C165 255 168 470 215 600 L378 600 C425 470 428 255 392 135 Z" fill="#fee2e2" opacity="0.78"/>
  <path d="M188 255 C245 235 330 285 395 255" class="thin"/>
  <path d="M178 390 C250 365 335 420 404 390" class="thin"/>
  <path d="M188 525 C260 500 334 552 394 525" class="thin"/>
  <rect x="218" y="627" width="154" height="34" rx="15" fill="#f97316" opacity="0.88"/>
</g>
<g>
  <rect x="120" y="245" width="300" height="124" rx="24" class="callout"/>
  <text x="150" y="293" class="label">Top inputs</text>
  <text x="150" y="334" class="text">iron ore + coke</text>
  <text x="150" y="365" class="text">+ limestone</text>
  <path d="M420 305 C470 305 485 300 515 294" class="arrow"/>

  <rect x="120" y="505" width="300" height="120" rx="24" class="callout"/>
  <text x="150" y="553" class="label">Hot air blast</text>
  <text x="150" y="592" class="small">blown in near the base</text>
  <path d="M420 560 C470 560 485 560 515 560" class="arrowBlue"/>

  <rect x="1180" y="245" width="280" height="118" rx="24" class="callout"/>
  <text x="1210" y="293" class="label">Waste gases</text>
  <text x="1210" y="332" class="small">leave at the top</text>
  <path d="M1180 304 C1140 304 1120 300 1095 292" class="arrow"/>

  <rect x="1130" y="505" width="330" height="126" rx="24" class="callout"/>
  <text x="1160" y="553" class="label">Tapped off at bottom</text>
  <text x="1160" y="592" class="text">molten iron and slag</text>
  <path d="M1130 565 C1090 565 1070 600 1040 660" class="arrowOrange"/>
</g>
<rect x="360" y="842" width="880" height="72" rx="24" class="chipGreen"/>
<text x="800" y="887" text-anchor="middle" class="text">Carbon monoxide removes oxygen from iron oxide to make iron.</text>

</svg>