<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Carbon cycle source style diagram</title>
  <desc id="desc">A simple carbon cycle diagram with atmosphere, plant, animal, dead material and fuel combustion.</desc>
  <rect width="900" height="560" fill="#fff"/>
  <rect x="55" y="40" width="790" height="480" rx="22" fill="#fbfff8" stroke="#cfe0c8" stroke-width="2"/>
  <text x="95" y="92" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#243447">Carbon cycle</text>
  <text x="95" y="122" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52667a">Label the processes shown by the arrows.</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="325" y="75" width="250" height="70" rx="18" fill="#e9f4ff" stroke="#7aa7d9" stroke-width="3"/>
    <text x="450" y="117" font-size="22" font-weight="700" fill="#243447">carbon dioxide in air</text>
    <rect x="140" y="250" width="145" height="85" rx="18" fill="#dff3df" stroke="#7db77d" stroke-width="3"/>
    <text x="212" y="300" font-size="22" font-weight="700" fill="#2e6e2e">plants</text>
    <rect x="385" y="250" width="145" height="85" rx="18" fill="#fff3c7" stroke="#caa34a" stroke-width="3"/>
    <text x="457" y="300" font-size="22" font-weight="700" fill="#8b5a00">animals</text>
    <rect x="615" y="250" width="145" height="85" rx="18" fill="#f1e2d1" stroke="#b19068" stroke-width="3"/>
    <text x="687" y="288" font-size="20" font-weight="700" fill="#664a32">dead</text>
    <text x="687" y="313" font-size="20" font-weight="700" fill="#664a32">material</text>
    <rect x="325" y="405" width="250" height="65" rx="18" fill="#f6e6e6" stroke="#c28b8b" stroke-width="3"/>
    <text x="450" y="445" font-size="21" font-weight="700" fill="#7b3333">fossil fuels / combustion</text>
  </g>
  <g stroke="#607d8b" stroke-width="4" fill="none" marker-end="url(#arr)">
    <path d="M335 142 C260 165, 220 195, 214 248"/>
    <path d="M285 292 H382"/>
    <path d="M530 292 H612"/>
    <path d="M687 338 C640 390, 575 420, 575 438"/>
    <path d="M450 405 C450 320, 450 220, 450 148"/>
    <path d="M575 438 C710 400, 730 180, 575 118"/>
    <path d="M212 250 C210 180, 260 130, 325 110"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52667a">
    <text x="165" y="205">A</text><text x="330" y="278">B</text><text x="565" y="278">C</text>
    <text x="606" y="390">D</text><text x="470" y="215">E</text><text x="700" y="188">F</text>
  </g>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/></marker></defs>
</svg>