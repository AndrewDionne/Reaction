<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Source-style particle diagram options A to D</title>
<desc id="desc">Four particle diagram options. Option C is a regular giant lattice with strong bonds and a crack plane, representing a high melting point but brittle material.</desc>
<rect width="900" height="560" fill="#fff"/>
<rect x="50" y="40" width="800" height="480" rx="22" fill="#fbfcff" stroke="#d0d8e4" stroke-width="2"/>
<text x="92" y="92" font-family="Arial" font-size="28" font-weight="700" fill="#213547">Which structure is high melting point but brittle?</text>
<text x="92" y="124" font-family="Arial" font-size="18" fill="#4d6378">Choose the regular giant lattice with many strong bonds.</text>
<g font-family="Arial" font-size="22" font-weight="700" fill="#213547" text-anchor="middle"><text x="185" y="174">A</text><text x="365" y="174">B</text><text x="545" y="174">C</text><text x="725" y="174">D</text></g>
<g transform="translate(110 195)">
  <g transform="translate(0 0)"><rect width="145" height="175" rx="16" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><g fill="#78a7d8"><circle cx="45" cy="45" r="13"/><circle cx="100" cy="55" r="13"/><circle cx="65" cy="100" r="13"/><circle cx="105" cy="132" r="13"/></g><g stroke="#9db4cc" stroke-width="3"><line x1="45" y1="45" x2="100" y2="55"/><line x1="65" y1="100" x2="105" y2="132"/></g></g>
  <g transform="translate(180 0)"><rect width="145" height="175" rx="16" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><g fill="#78a7d8"><circle cx="45" cy="45" r="13"/><circle cx="100" cy="48" r="13"/><circle cx="45" cy="105" r="13"/><circle cx="100" cy="108" r="13"/></g><g stroke="#9db4cc" stroke-width="2"><line x1="45" y1="45" x2="100" y2="48"/><line x1="45" y1="105" x2="100" y2="108"/></g></g>
  <g transform="translate(360 0)"><rect width="145" height="175" rx="16" fill="#fff" stroke="#2d7a32" stroke-width="4"/><g stroke="#7d97b6" stroke-width="2.5"><line x1="35" y1="35" x2="110" y2="35"/><line x1="35" y1="70" x2="110" y2="70"/><line x1="35" y1="105" x2="110" y2="105"/><line x1="35" y1="140" x2="110" y2="140"/><line x1="35" y1="35" x2="35" y2="140"/><line x1="72" y1="35" x2="72" y2="140"/><line x1="110" y1="35" x2="110" y2="140"/></g><g fill="#5c84b1"><circle cx="35" cy="35" r="7"/><circle cx="72" cy="35" r="7"/><circle cx="110" cy="35" r="7"/><circle cx="35" cy="70" r="7"/><circle cx="72" cy="70" r="7"/><circle cx="110" cy="70" r="7"/><circle cx="35" cy="105" r="7"/><circle cx="72" cy="105" r="7"/><circle cx="110" cy="105" r="7"/><circle cx="35" cy="140" r="7"/><circle cx="72" cy="140" r="7"/><circle cx="110" cy="140" r="7"/></g><path d="M25 30 L60 70 L72 102 L118 148" stroke="#d64541" stroke-width="5" fill="none" stroke-linecap="round"/></g>
  <g transform="translate(540 0)"><rect width="145" height="175" rx="16" fill="#fff" stroke="#cfd8e3" stroke-width="2"/><g fill="#78a7d8"><circle cx="42" cy="48" r="13"/><circle cx="92" cy="75" r="13"/><circle cx="55" cy="128" r="13"/></g><path d="M20 140 C50 80,95 125,120 35" fill="none" stroke="#9db4cc" stroke-width="3" stroke-dasharray="6 6"/></g>
</g>
<rect x="295" y="415" width="310" height="58" rx="16" fill="#fff" stroke="#d0d8e4" stroke-width="2"/>
<text x="450" y="440" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#213547">C: regular giant lattice</text>
<text x="450" y="462" text-anchor="middle" font-family="Arial" font-size="16" fill="#4d6378">Strong bonds give high melting point; rigid planes can crack.</text>
</svg>