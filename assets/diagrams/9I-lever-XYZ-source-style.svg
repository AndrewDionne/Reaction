<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Source-style lever labelled X Y Z</title>
<desc id="desc">A lever with a load, pivot and effort labelled X Y and Z. Y points to the pivot or fulcrum.</desc>
<rect width="900" height="560" fill="#fff"/>
<rect x="50" y="40" width="800" height="480" rx="22" fill="#fffdf8" stroke="#dfd8c8" stroke-width="2"/>
<text x="92" y="94" font-family="Arial" font-size="30" font-weight="700" fill="#213547">Lever labels</text>
<text x="92" y="126" font-family="Arial" font-size="18" fill="#4d6378">The pivot point of a lever is called the fulcrum.</text>
<g transform="translate(160 205)">
<rect x="80" y="100" width="485" height="24" rx="12" fill="#b9854d" stroke="#8b5e2d" stroke-width="3" transform="rotate(-8 322 112)"/>
<polygon points="285,190 345,190 315,122" fill="#8aa4b7" stroke="#57738a" stroke-width="3"/>
<circle cx="128" cy="112" r="32" fill="#858585" stroke="#5e5e5e" stroke-width="3"/>
<line x1="515" y1="62" x2="515" y2="113" stroke="#2364aa" stroke-width="7" marker-end="url(#down)"/>
<text x="515" y="48" text-anchor="middle" font-family="Arial" font-size="18" fill="#2364aa">effort</text>
</g>
<defs><marker id="down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2364aa"/></marker></defs>
<g font-family="Arial" font-size="28" font-weight="700" text-anchor="middle" fill="#213547">
<circle cx="240" cy="260" r="28" fill="#fff" stroke="#415a77" stroke-width="3"/><text x="240" y="270">X</text>
<circle cx="475" cy="365" r="28" fill="#fff" stroke="#415a77" stroke-width="3"/><text x="475" y="375">Y</text>
<circle cx="700" cy="245" r="28" fill="#fff" stroke="#415a77" stroke-width="3"/><text x="700" y="255">Z</text>
</g>
<g stroke="#415a77" stroke-width="2.5"><line x1="268" y1="260" x2="288" y2="285"/><line x1="475" y1="337" x2="475" y2="325"/><line x1="672" y1="245" x2="640" y2="278"/></g>
<rect x="585" y="365" width="190" height="70" rx="16" fill="#fff" stroke="#dfd8c8" stroke-width="2"/>
<text x="603" y="393" font-family="Arial" font-size="18" font-weight="700" fill="#213547">Answer cue</text>
<text x="603" y="418" font-family="Arial" font-size="17" fill="#4d6378">Y labels the pivot / fulcrum.</text>
</svg>