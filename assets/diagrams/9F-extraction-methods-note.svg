<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Metal extraction comparison note diagram</title>
<desc id="desc">A simplified two-panel comparison of carbon reduction and electrolysis with clear spacing.</desc>
<rect width="1600" height="1000" fill="#ffffff"/>
<defs>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/></marker>
<style>
  .title{font-family:Arial,Helvetica,sans-serif;font-size:52px;font-weight:800;fill:#1f2f46}
  .sub{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#52667a}
  .label{font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:750;fill:#223247}
  .text{font-family:Arial,Helvetica,sans-serif;font-size:26px;fill:#223247}
  .small{font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#516477}
  .tiny{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#516477}
  .badgeText{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:800;fill:#ffffff}
  .card{fill:#fbfdff;stroke:#c7d3e0;stroke-width:4}
  .panelBlue{fill:#eef6ff;stroke:#93c5fd;stroke-width:4}
  .panelGreen{fill:#eefbf3;stroke:#9bd0a6;stroke-width:4}
  .panelAmber{fill:#fff8e6;stroke:#e8c96d;stroke-width:4}
  .panelGrey{fill:#f6f8fb;stroke:#ccd7e2;stroke-width:4}
  .callout{fill:#ffffff;stroke:#cad6e2;stroke-width:4}
  .chipBlue{fill:#e0f2fe;stroke:#7dd3fc;stroke-width:3}
  .chipGreen{fill:#ecfdf5;stroke:#86efac;stroke-width:3}
  .chipLav{fill:#eef2ff;stroke:#a5b4fc;stroke-width:3}
  .wire{stroke:#30465f;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sym{stroke:#30465f;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#516477;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .measure{stroke:#64748b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8}

.arrowBlue{stroke:#2563eb;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
</style></defs>
<rect x="70" y="60" width="1460" height="880" rx="38" class="card"/>

<text x="130" y="140" class="title">Choosing an extraction method</text>
<text x="130" y="186" class="sub">Below carbon: carbon reduction can be used. Above carbon: electrolysis is needed.</text>
<g transform="translate(120 240)">
  <rect x="0" y="0" width="620" height="600" rx="34" class="panelAmber"/>
  <text x="310" y="64" text-anchor="middle" class="label">Carbon reduction</text>
  <text x="310" y="100" text-anchor="middle" class="small">metals below carbon</text>
  <rect x="185" y="165" width="250" height="170" rx="24" fill="#fff" stroke="#7c4a15" stroke-width="7"/>
  <circle cx="255" cy="208" r="23" fill="#1f2937"/>
  <circle cx="310" cy="210" r="21" fill="#1f2937"/>
  <circle cx="365" cy="206" r="23" fill="#1f2937"/>
  <path d="M205 298 C270 272 356 324 415 292 L415 330 L205 330 Z" fill="#9a3412" opacity="0.72"/>
  <rect x="235" y="392" width="150" height="54" rx="16" fill="#fb923c" stroke="#9a3412" stroke-width="5"/>
  <path d="M310 392 V344" class="wire" stroke="#ea580c"/>
  <rect x="90" y="500" width="440" height="68" rx="20" class="callout"/>
  <text x="310" y="542" text-anchor="middle" class="text">Example: iron from iron oxide</text>
</g>
<g transform="translate(860 240)">
  <rect x="0" y="0" width="620" height="600" rx="34" class="panelBlue"/>
  <text x="310" y="64" text-anchor="middle" class="label">Electrolysis</text>
  <text x="310" y="100" text-anchor="middle" class="small">metals above carbon</text>
  <rect x="165" y="150" width="290" height="190" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="6"/>
  <rect x="228" y="130" width="36" height="185" rx="9" fill="#374151"/>
  <rect x="356" y="130" width="36" height="185" rx="9" fill="#374151"/>
  <path class="wire" d="M246 130 V92 H374 V130"/>
  <rect x="279" y="48" width="62" height="38" rx="8" fill="#ffffff" stroke="#30465f" stroke-width="4"/>
  <text x="310" y="74" text-anchor="middle" class="small">DC</text>
  <circle cx="255" cy="402" r="12" fill="#facc15" opacity="0.9"/>
  <circle cx="310" cy="424" r="11" fill="#facc15" opacity="0.9"/>
  <circle cx="365" cy="402" r="12" fill="#facc15" opacity="0.9"/>
  <rect x="90" y="500" width="440" height="68" rx="20" class="callout"/>
  <text x="310" y="542" text-anchor="middle" class="text">Example: aluminium from aluminium oxide</text>
</g>

</svg>