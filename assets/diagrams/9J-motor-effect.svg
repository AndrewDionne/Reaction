<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Motor effect</title>
<desc id="desc">A current-carrying wire between magnet poles showing a force direction, with notes that larger current or stronger field give a bigger force.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfdff" stroke="#c7d3e0" stroke-width="2"/>
<text x="90" y="95" font-family="Arial" font-size="30" font-weight="700" fill="#243447">Motor effect</text>
<text x="90" y="127" font-family="Arial" font-size="18" fill="#43576b">A current-carrying wire in a magnetic field experiences a force.</text>
<g transform="translate(170 180)">
  <rect x="0" y="70" width="100" height="150" rx="12" fill="#3498db" stroke="#236a99" stroke-width="3"/>
  <text x="50" y="157" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">N</text>
  <rect x="360" y="70" width="100" height="150" rx="12" fill="#e67e22" stroke="#b85d13" stroke-width="3"/>
  <text x="410" y="157" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">S</text>
  <g stroke="#6b7f91" stroke-width="2" fill="none" marker-end="url(#farr)">
    <line x1="100" y1="95" x2="360" y2="95"/>
    <line x1="100" y1="125" x2="360" y2="125"/>
    <line x1="100" y1="155" x2="360" y2="155"/>
    <line x1="100" y1="185" x2="360" y2="185"/>
  </g>
  <line x1="230" y1="40" x2="230" y2="250" stroke="#2f3f4f" stroke-width="8"/>
  <circle cx="230" cy="40" r="18" fill="#ffffff" stroke="#2f3f4f" stroke-width="3"/>
  <circle cx="230" cy="250" r="18" fill="#2f3f4f"/>
  <circle cx="230" cy="250" r="8" fill="#fff"/>
  <line x1="270" y1="145" x2="330" y2="145" stroke="#27ae60" stroke-width="6" marker-end="url(#force)"/>
  <text x="238" y="20" font-family="Arial" font-size="18" fill="#43576b">current into page</text>
  <text x="238" y="282" font-family="Arial" font-size="18" fill="#43576b">current out of page</text>
  <text x="286" y="135" font-family="Arial" font-size="18" fill="#27ae60">force</text>
</g>
<rect x="610" y="205" width="170" height="105" rx="18" fill="#ffffff" stroke="#c7d3e0" stroke-width="2"/>
<text x="630" y="240" font-family="Arial" font-size="20" font-weight="700" fill="#243447">Bigger force</text>
<text x="630" y="272" font-family="Arial" font-size="18" fill="#43576b">• more current</text>
<text x="630" y="298" font-family="Arial" font-size="18" fill="#43576b">• stronger field</text>
<defs>
<marker id="farr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7f91"/></marker>
<marker id="force" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/></marker>
</defs>
</svg>