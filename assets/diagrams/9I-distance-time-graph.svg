<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Distance-time graph with section B flat</title>
  <desc id="desc">A distance-time graph with section A rising, section B horizontal, and section C rising again. The flat section B shows that the car has stopped.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#fbfdff" stroke="#c7d3e0" stroke-width="2"/>
  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#243447">Distance–time graph</text>
  <text x="90" y="127" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">A horizontal section means distance does not change, so the object is stopped.</text>
  <line x1="130" y1="440" x2="770" y2="440" stroke="#2f3f4f" stroke-width="3"/>
  <line x1="130" y1="440" x2="130" y2="170" stroke="#2f3f4f" stroke-width="3"/>
  <text x="450" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#34495e">Time</text>
  <text x="60" y="310" transform="rotate(-90 60 310)" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#34495e">Distance</text>
  <path d="M160 400 L300 285 L470 285 L650 190" fill="none" stroke="#2e86de" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#243447">
    <text x="220" y="330">A</text>
    <text x="385" y="270">B</text>
    <text x="560" y="230">C</text>
  </g>
  <rect x="540" y="340" width="220" height="90" rx="16" fill="#ffffff" stroke="#c7d3e0" stroke-width="2"/>
  <text x="560" y="375" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#243447">Stopped section</text>
  <text x="560" y="405" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#43576b">Section B is flat, so the car has stopped.</text>
</svg>
