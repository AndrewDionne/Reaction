<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Distance-time graph with section B flat</title>
  <desc id="desc">A distance-time graph with section A rising, section B horizontal and section C rising again.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <rect x="50" y="40" width="800" height="480" rx="24" fill="#f8fbff" stroke="#c9d6e5" stroke-width="2"/>
  <text x="90" y="96" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#243447">Distance–time graph</text>
  <text x="90" y="130" font-family="Arial, sans-serif" font-size="18" fill="#40566f">A horizontal section means distance does not change, so the object is stopped.</text>
  <line x1="130" y1="430" x2="770" y2="430" stroke="#243447" stroke-width="3"/>
  <line x1="130" y1="430" x2="130" y2="170" stroke="#243447" stroke-width="3"/>
  <text x="450" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#243447">Time</text>
  <text x="70" y="300" transform="rotate(-90 70 300)" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#243447">Distance</text>
  <polyline points="160,390 300,275 470,275 650,180" fill="none" stroke="#2f80da" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="220" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#243447">A</text>
  <text x="385" y="260" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#243447">B</text>
  <text x="560" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#243447">C</text>
  <rect x="540" y="330" width="250" height="90" rx="18" fill="#ffffff" stroke="#c9d6e5" stroke-width="2"/>
  <text x="562" y="363" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#243447">Stopped section</text>
  <text x="562" y="392" font-family="Arial, sans-serif" font-size="16" fill="#40566f">Section B is flat, so the</text>
  <text x="562" y="414" font-family="Arial, sans-serif" font-size="16" fill="#40566f">car has stopped.</text>
</svg>
