<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Work done force distance diagram</title>
<desc id="desc">A box pushed across a distance by a force, with the equation work done equals force times distance.</desc>
<rect width="1600" height="1000" fill="#ffffff"/><defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#30465f"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/></marker>
  <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#ea580c"/></marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#dc2626"/></marker>
  <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#15803d"/></marker>
  <style>
  .title{font-family:Arial,Helvetica,sans-serif;font-size:52px;font-weight:800;fill:#1f2f46}
  .sub{font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#52667a}
  .label{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:750;fill:#223247}
  .text{font-family:Arial,Helvetica,sans-serif;font-size:29px;fill:#223247}
  .small{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#516477}
  .tiny{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#516477}
  .badgeText{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:800;fill:#ffffff}
  .card{fill:#fbfdff;stroke:#c7d3e0;stroke-width:4}
  .panelBlue{fill:#eaf5ff;stroke:#78aee3;stroke-width:4}
  .panelGreen{fill:#e9f7ef;stroke:#69b984;stroke-width:4}
  .panelAmber{fill:#fff6dc;stroke:#d8b957;stroke-width:4}
  .panelGrey{fill:#f4f7fa;stroke:#bac6d1;stroke-width:4}
  .panelRed{fill:#fff0ef;stroke:#d59088;stroke-width:4}
  .wire{stroke:#30465f;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .line{stroke:#30465f;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#516477;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{stroke:#30465f;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  .arrowBlue{stroke:#2563eb;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
  .arrowOrange{stroke:#ea580c;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOrange)}
  .arrowRed{stroke:#dc2626;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowRed)}
  .arrowGreen{stroke:#15803d;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
</style>
</defs>
<rect x="70" y="60" width="1460" height="880" rx="38" class="card"/>
<text x="130" y="145" class="title">Work done</text>
<g transform="translate(190 320)">
  <line x1="0" y1="360" x2="1220" y2="360" stroke="#94a3b8" stroke-width="8"/>
  <rect x="170" y="190" width="220" height="170" rx="24" fill="#fde68a" stroke="#b45309" stroke-width="7"/>
  <path class="arrowBlue" d="M70 275 H165"/><text x="150" y="238" text-anchor="middle" class="label">force</text>
  <path class="arrowGreen" d="M420 425 H980"/><text x="700" y="485" text-anchor="middle" class="label">distance moved</text>
  <rect x="575" y="70" width="585" height="100" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="5"/>
  <text x="868" y="134" text-anchor="middle" class="label">work done = force × distance</text>
</g>
</svg>
